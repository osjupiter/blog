name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # dedup step deletes duplicated github-pages artifacts
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_index.py reads article dates from git history
      - name: Build index page
        run: python3 scripts/build_index.py
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Dedup pages artifact
        # The upload API sometimes registers the same artifact multiple times,
        # and deploy-pages refuses to run when the name is ambiguous.
        # Keep only the newest "github-pages" artifact of this run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name=="github-pages")] | sort_by(.id) | .[:-1] | .[].id')
          for id in $ids; do
            echo "deleting duplicate artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
      - id: deployment
        uses: actions/deploy-pages@v4
